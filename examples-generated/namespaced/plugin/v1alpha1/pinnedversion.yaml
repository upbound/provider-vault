apiVersion: plugin.vault.m.upbound.io/v1alpha1
kind: PinnedVersion
metadata:
  annotations:
    meta.upbound.io/example-id: plugin/v1alpha1/pinnedversion
  labels:
    testing.upbound.io/example-name: jwt_pin
  name: jwt-pin
  namespace: upbound-system
spec:
  forProvider:
    nameSelector:
      matchLabels:
        testing.upbound.io/example-name: jwt
    typeSelector:
      matchLabels:
        testing.upbound.io/example-name: jwt
    versionSelector:
      matchLabels:
        testing.upbound.io/example-name: jwt

---

apiVersion: auth.vault.m.upbound.io/v1alpha1
kind: Backend
metadata:
  annotations:
    meta.upbound.io/example-id: plugin/v1alpha1/pinnedversion
  labels:
    testing.upbound.io/example-name: jwt_auth
  name: jwt-auth
  namespace: upbound-system
spec:
  forProvider:
    type: jwt

---

apiVersion: plugin.vault.m.upbound.io/v1alpha1
kind: Plugin
metadata:
  annotations:
    meta.upbound.io/example-id: plugin/v1alpha1/pinnedversion
  labels:
    testing.upbound.io/example-name: jwt
  name: jwt
  namespace: upbound-system
spec:
  forProvider:
    command: vault-plugin-auth-jwt
    envSecretRef:
    - key: example-key
      name: example-secret
    name: jwt
    sha256: 6bd0a803ed742aa3ce35e4fa23d2c8d550e6c1567bf63410cec489c28b68b0fc
    type: auth
    version: v0.17.0
