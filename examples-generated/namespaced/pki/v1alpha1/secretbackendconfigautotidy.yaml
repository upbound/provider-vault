apiVersion: pki.vault.m.upbound.io/v1alpha1
kind: SecretBackendConfigAutoTidy
metadata:
  annotations:
    meta.upbound.io/example-id: pki/v1alpha1/secretbackendconfigautotidy
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: upbound-system
spec:
  forProvider:
    backendSelector:
      matchLabels:
        testing.upbound.io/example-name: pki
    enabled: true
    intervalDuration: 1h
    tidyCertStore: true

---

apiVersion: vault.vault.m.upbound.io/v1alpha1
kind: Mount
metadata:
  annotations:
    meta.upbound.io/example-id: pki/v1alpha1/secretbackendconfigautotidy
  labels:
    testing.upbound.io/example-name: pki
  name: pki
  namespace: upbound-system
spec:
  forProvider:
    defaultLeaseTtlSeconds: 3600
    maxLeaseTtlSeconds: 86400
    path: pki
    type: pki
